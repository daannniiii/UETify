<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify API Visual Tester</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #181818;
      --primary: #1DB954;
      --text: #FFFFFF;
      --text-muted: #B3B3B3;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1, h2 {
      margin-top: 0;
    }
    .card {
      background-color: var(--surface);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      background-color: #282828;
      border: 1px solid transparent;
      border-radius: 4px;
      color: white;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      transform: scale(1.02);
      background-color: #1ed760;
    }
    .token-display {
      background: #000;
      padding: 10px;
      border-radius: 4px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      color: var(--primary);
      margin-top: 10px;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .track-card {
      background-color: var(--surface);
      border-radius: 8px;
      padding: 16px;
      transition: background-color 0.2s;
    }
    .track-card:hover {
      background-color: #282828;
    }
    .track-image {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      margin-bottom: 12px;
      background-color: #333;
    }
    .track-title {
      font-weight: bold;
      margin: 0 0 4px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      color: var(--text-muted);
      font-size: 12px;
      margin: 0 0 8px;
    }
    .raw-data-btn {
      background-color: #333;
      font-size: 11px;
      padding: 6px 12px;
    }
    #error-message {
      color: #e22134;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Spotify API Visual Tester</h1>
    
    <!-- AUTH SECTION -->
    <div class="card">
      <h2>1. Authentication</h2>
      <p style="font-size: 14px; color: var(--text-muted);">Paste your credentials from your .env file here to generate an access token.</p>
      
      <label>Client ID</label>
      <input type="text" id="clientId" placeholder="Enter your Spotify Client ID">
      
      <label>Client Secret</label>
      <input type="password" id="clientSecret" placeholder="Enter your Spotify Client Secret">
      
      <button onclick="getAccessToken()">Get Access Token</button>
      <div id="error-message"></div>
      
      <div id="tokenContainer" style="display: none; margin-top: 15px;">
        <label>Your Temporary Access Token:</label>
        <div class="token-display" id="tokenDisplay"></div>
      </div>
    </div>

    <!-- SEARCH SECTION -->
    <div class="card" id="searchSection" style="opacity: 0.5; pointer-events: none;">
      <h2>2. Search for a Song</h2>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="searchInput" placeholder="e.g. Starboy" style="margin: 0;">
        <button onclick="searchSpotify()">Search</button>
      </div>
    </div>

    <!-- RESULTS SECTION -->
    <div id="resultsGrid" class="results-grid"></div>
  </div>

  <script>
    let currentToken = '';

    async function getAccessToken() {
      const clientId = document.getElementById('clientId').value.trim();
      const clientSecret = document.getElementById('clientSecret').value.trim();
      const errorMsg = document.getElementById('error-message');
      
      if (!clientId || !clientSecret) {
        errorMsg.textContent = 'Please enter both Client ID and Client Secret.';
        return;
      }
      
      errorMsg.textContent = 'Authenticating...';
      
      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
          },
          body: 'grant_type=client_credentials'
        });

        if (!response.ok) throw new Error('Authentication failed. Check your credentials.');
        
        const data = await response.json();
        currentToken = data.access_token;
        
        // Update UI
        document.getElementById('tokenDisplay').textContent = currentToken;
        document.getElementById('tokenContainer').style.display = 'block';
        errorMsg.textContent = '';
        
        // Enable search section
        const searchSection = document.getElementById('searchSection');
        searchSection.style.opacity = '1';
        searchSection.style.pointerEvents = 'all';
        
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    }

    async function searchSpotify() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query || !currentToken) return;

      const resultsGrid = document.getElementById('resultsGrid');
      resultsGrid.innerHTML = '<p>Searching...</p>';

      try {
        const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`, {
          headers: {
            'Authorization': `Bearer ${currentToken}`
          }
        });

        if (!response.ok) throw new Error('Failed to fetch results.');
        
        const data = await response.json();
        const tracks = data.tracks.items;
        
        resultsGrid.innerHTML = '';
        
        if (tracks.length === 0) {
          resultsGrid.innerHTML = '<p>No results found.</p>';
          return;
        }

        tracks.forEach(track => {
          const imageUrl = track.album.images[0]?.url || '';
          
          const card = document.createElement('div');
          card.className = 'track-card';
          card.innerHTML = `
            <img src="${imageUrl}" class="track-image" alt="Album Art">
            <p class="track-title" title="${track.name}">${track.name}</p>
            <p class="track-artist">${track.artists.map(a => a.name).join(', ')}</p>
            <p class="track-artist" style="font-size: 10px;">Album: ${track.album.name}</p>
            <button class="raw-data-btn" onclick='showRawData(${JSON.stringify(track).replace(/'/g, "&#39;")})'>View Raw JSON</button>
          `;
          resultsGrid.appendChild(card);
        });

      } catch (err) {
        resultsGrid.innerHTML = `<p style="color: #e22134;">Error: ${err.message}</p>`;
      }
    }

    function showRawData(data) {
      alert(JSON.stringify(data, null, 2));
    }
  </script>
</body>
</html>
